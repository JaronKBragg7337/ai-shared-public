<style>
:root {
  /* Warm reading room: cream paper, ink, a deep forest accent. One column, numbered entries, search on top. */
  --paper: #f6f0e4;
  --card: #fffaf1;
  --ink: #2b2620;
  --muted: #6e6355;
  --rule: #e3d8c4;
  --accent: #2f5d50;
  --accent-soft: #dfe9e3;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1d1a16; --card: #26221c; --ink: #efe6d6; --muted: #b3a690;
    --rule: #3a342b; --accent: #8fc2ae; --accent-soft: #2c3a33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1d1a16; --card: #26221c; --ink: #efe6d6; --muted: #b3a690;
  --rule: #3a342b; --accent: #8fc2ae; --accent-soft: #2c3a33; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--body); }
main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 22px; }
h1 { font: 600 2rem/1.15 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 600 1.25rem/1.2 var(--display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 11px; font-size: .9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.tools { position: sticky; top: 0; background: var(--paper); padding: 10px 0; display: grid; gap: 8px; z-index: 2; border-bottom: 1px solid var(--rule); }
input[type=search] { width: 100%; font: inherit; padding: 11px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); color: var(--ink); }
input[type=search]:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: 600 .9rem var(--body); border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.filters button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.saying { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; }
.saying p { margin: 0; font: 500 1.08rem/1.55 var(--display); }
.list { display: grid; gap: 12px; }
.p { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; scroll-margin-top: 130px; }
.p:target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.meta { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.num { font: 600 1rem var(--display); color: var(--accent); }
.text { margin: 0; overflow-wrap: anywhere; }
.from { margin: 0; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 6px; font-size: .88rem; }
.links a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
footer { color: var(--muted); font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<body>
<main>
  <header>
    <h1>Jaron's Principles</h1>
    <p class="lede">Every principle pulled from Jaron's own words, numbered in the order they came, with the moment each one came from. Tap a linked number to jump to the principle it builds on.</p>
    <div class="stats" id="stats"></div>
  </header>
  <section class="tools" aria-label="Search and filter">
    <label for="q" class="sr" style="position:absolute;left:-9999px">Search principles</label>
    <input id="q" type="search" placeholder="Search words, like time, fog, people, chessboard">
    <div class="filters" id="filters" role="group" aria-label="Show"></div>
  </section>
  <section id="sayings" aria-label="Sayings in his own words"></section>
  <section class="list" id="list" aria-live="polite"></section>
  <footer id="foot"></footer>
</main>
<script>
const P = [{"id": "P-0001", "n": 1, "date": "10/25", "text": "Describe what's wrong by comparing it to something familiar (\"Orbeez\") - a spec, not a complaint", "from": "water v1", "links": ["P-0002"], "how": "", "status": ""}, {"id": "P-0002", "n": 2, "date": "10/25", "text": "Every object can tell its own history (IDs + time + what it caused)", "from": "water trails -> The Necklace (his book)", "links": ["P-0003", "P-0005"], "how": "", "status": ""}, {"id": "P-0003", "n": 3, "date": "10/25", "text": "Memory fade: unseen = faded, never invented; made = marked made", "from": "Assassin's Creed memory", "links": ["P-0004"], "how": "", "status": ""}, {"id": "P-0004", "n": 4, "date": "10/25", "text": "A faded door is a locked door: the same rule is honesty in one product and a game mechanic in another", "from": "Grok bedroom (3 doors)", "links": ["P-0003"], "how": "", "status": ""}, {"id": "P-0005", "n": 5, "date": "10/25", "text": "Best angle first, then map through (anchor frame)", "from": "phone video angles", "links": ["P-0006"], "how": "", "status": ""}, {"id": "P-0006", "n": 6, "date": "10/25", "text": "Hand the anchor picture back and ask for a new angle - stands in for the AI's missing memory", "from": "Grok rooms", "links": ["P-0005"], "how": "", "status": ""}, {"id": "P-0007", "n": 7, "date": "10/26", "text": "Everything is a loop; each turn needs someone's spark (recycling symbol)", "from": "values post; worlds-in-orbit layout", "links": ["P-0008"], "how": "", "status": ""}, {"id": "P-0008", "n": 8, "date": "10/26", "text": "One voice to talk to, many AIs behind it; he can ride another session's loop", "from": "helper-session idea", "links": ["P-0007"], "how": "", "status": ""}, {"id": "P-0009", "n": 9, "date": "10/26", "text": "Build general, not boxes; compare to big tools as a to-do list, not a ceiling", "from": "parity maps", "links": ["P-0002"], "how": "", "status": ""}, {"id": "P-0010", "n": 10, "date": "2025-04", "text": "Use one system's output as another system's input", "from": "April resource systems; Lava Ball / Nexus on 04/19 ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0012", "P-0014", "P-0019"], "how": "", "status": ""}, {"id": "P-0011", "n": 11, "date": "2025-04", "text": "Check what changes when the same system enters a different environment", "from": "Earth and Mars resource and habitat concepts ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0009", "P-0010", "P-0015"], "how": "", "status": ""}, {"id": "P-0012", "n": 12, "date": "2025-05-15", "text": "Combine mechanisms that perform different parts of a larger job", "from": "SYL Loop Protocol ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0010", "P-0013", "P-0041", "P-0087"], "how": "", "status": ""}, {"id": "P-0013", "n": 13, "date": "2025-05-15", "text": "Include a return or reset path when designing a cycle", "from": "SYL Loop Protocol ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0010", "P-0036"], "how": "", "status": ""}, {"id": "P-0014", "n": 14, "date": "2025-06-12", "text": "Look for connected loops at mechanical, material and economic levels", "from": "Turtus robotics ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0010", "P-0019", "P-0037"], "how": "", "status": ""}, {"id": "P-0015", "n": 15, "date": "2025-11-18", "text": "Keep the core principle while adapting its expression to the environment", "from": "DNA and changing rules; later Orchestra and The Facing Field ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0004", "P-0009", "P-0011", "P-0023", "P-0037"], "how": "", "status": ""}, {"id": "P-0016", "n": 16, "date": "2025-12", "text": "Keep durable memory separate from the agent, machine or interface using it", "from": "PMS / RUS; later AI Mailbox ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0008", "P-0017", "P-0018", "P-0079", "P-0080"], "how": "", "status": ""}, {"id": "P-0017", "n": 17, "date": "2025-12", "text": "Preserve history and its origins so later systems can replay or inspect it", "from": "PMS / RUS ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0016", "P-0046", "P-0058"], "how": "", "status": ""}, {"id": "P-0018", "n": 18, "date": "2025-12", "text": "Give independent instances identities and a shared way to communicate", "from": "AETHERSPAN ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0008", "P-0016", "P-0064", "P-0071"], "how": "", "status": ""}, {"id": "P-0019", "n": 19, "date": "2026-02-03", "text": "Trace how a change passes through linked systems at different scales", "from": "Frequency Cascade Recycling Theory ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0010", "P-0014", "P-0020", "P-0093"], "how": "", "status": ""}, {"id": "P-0020", "n": 20, "date": "2026-03", "text": "Follow how limits change a system and how feedback helps it settle", "from": "DishBrain and adaptation discussions ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0013", "P-0019", "P-0021", "P-0036"], "how": "", "status": ""}, {"id": "P-0021", "n": 21, "date": "2026-03", "text": "Distinguish regulation, intelligence and consciousness before connecting them", "from": "DishBrain, biology and AI cognition ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0020", "P-0035", "P-0095"], "how": "", "status": ""}, {"id": "P-0022", "n": 22, "date": "2026-03 to 2026-05", "text": "Separate observing, combining ideas, checking, acting and learning from results", "from": "Orchestra; later AI cooperation and Fly Brain ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0023", "P-0024", "P-0036", "P-0096"], "how": "", "status": ""}, {"id": "P-0023", "n": 23, "date": "2026-05", "text": "Test a reusable way of working in one field without tying it to that field", "from": "Orchestra 3.7.2 ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0022", "P-0030", "P-0048"], "how": "", "status": ""}, {"id": "P-0024", "n": 24, "date": "2026-05", "text": "Gather independent observations before combining judgments", "from": "Orchestra; later AI cooperation and the room comparison ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt), [T03](sources/2026-10-26-chatgpt-systems-thinking.md#turn-03-chatgpt))", "links": ["P-0022", "P-0064", "P-0098"], "how": "", "status": ""}, {"id": "P-0025", "n": 25, "date": "2026-05-29", "text": "Look for memory in relationships and arrangement as well as stored items", "from": "Memory as spatial arrangement ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0026", "P-0037", "P-0079", "P-0091"], "how": "", "status": ""}, {"id": "P-0026", "n": 26, "date": "2026-05-29", "text": "Compare separate lines of thought that arrive at a similar structure", "from": "Spatial memory; The Facing Field provenance on 06/28 ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0025", "P-0041", "P-0081"], "how": "", "status": ""}, {"id": "P-0027", "n": 27, "date": "2026-06", "text": "Combine incomplete observations to understand more of the situation", "from": "Wearable sensing research ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0005", "P-0006", "P-0024", "P-0043"], "how": "", "status": ""}, {"id": "P-0028", "n": 28, "date": "2026-06-28", "text": "Preserve a clear unbuilt design until the needed capabilities exist", "from": "The Facing Field ([T45](sources/2026-10-26-chatgpt-systems-thinking.md#turn-45-chatgpt), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0039", "P-0082", "P-0097"], "how": "", "status": ""}, {"id": "P-0029", "n": 29, "date": "2026-07-04 to 2026-07-05", "text": "Reuse a way of keeping shared objects consistent across applications", "from": "Town Square / world_props to Fable Survival ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0030", "P-0033", "P-0097"], "how": "", "status": ""}, {"id": "P-0030", "n": 30, "date": "2026-07", "text": "Separate how things are built, how they run and what they remember", "from": "GameBlocks / Heartbeat Observatory Core Editor ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0009", "P-0023", "P-0029", "P-0033"], "how": "", "status": ""}, {"id": "P-0031", "n": 31, "date": "2026-07-06", "text": "Feed user observations back into builds that change the environment", "from": "Heartbeat game feedback ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0022", "P-0070", "P-0093"], "how": "", "status": ""}, {"id": "P-0032", "n": 32, "date": "2026-07-06", "text": "Preserve different learning stages and contradictions when joining research", "from": "Environment Constraint Consciousness Stack proposal ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0035", "P-0037", "P-0094", "P-0097"], "how": "", "status": ""}, {"id": "P-0033", "n": 33, "date": "2026-08", "text": "Keep the same objects and shared rules when moving between worlds", "from": "Factory and spatial worlds ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0029", "P-0030", "P-0034"], "how": "", "status": ""}, {"id": "P-0034", "n": 34, "date": "2026-08", "text": "Show a place at different scales while keeping the same shared rules", "from": "Factory and spatial worlds ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0033", "P-0037"], "how": "", "status": ""}, {"id": "P-0035", "n": 35, "date": "2026-09-13", "text": "Keep simulated behavior and measured behavior as different kinds of evidence", "from": "Fly Brain; later observed and inferred room geometry ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T03](sources/2026-10-26-chatgpt-systems-thinking.md#turn-03-chatgpt))", "links": ["P-0003", "P-0004", "P-0021", "P-0046", "P-0097"], "how": "", "status": ""}, {"id": "P-0036", "n": 36, "date": "2026-09-13", "text": "Record the consequences of actions before making the next decision", "from": "Fly Brain real world experimental loop ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0020", "P-0022", "P-0093"], "how": "", "status": ""}, {"id": "P-0037", "n": 37, "date": "2026-09-23", "text": "Break systems into layers and pieces before comparing them", "from": "Systems thinker explanation, restated by Jaron on 10/26 ([T43](sources/2026-10-26-chatgpt-systems-thinking.md#turn-43-jaron), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0009", "P-0015", "P-0025", "P-0038"], "how": "", "status": ""}, {"id": "P-0038", "n": 38, "date": "2026-09-23", "text": "Move to other layers when the first pieces do not connect", "from": "Cross layer comparison, restated by Jaron on 10/26 ([T43](sources/2026-10-26-chatgpt-systems-thinking.md#turn-43-jaron), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0037", "P-0081"], "how": "", "status": ""}, {"id": "P-0039", "n": 39, "date": "2026-09-23", "text": "Keep a small useful principle even when the original project is left behind", "from": "One percent reuse discussion; Jaron's 10/26 explanation ([T43](sources/2026-10-26-chatgpt-systems-thinking.md#turn-43-jaron), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0028", "P-0082", "P-0094"], "how": "", "status": ""}, {"id": "P-0040", "n": 40, "date": "2026-09-23", "text": "Use spatial arrangement to make relationships and cycles visible", "from": "Worlds in Orbit layout ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0025", "P-0091"], "how": "", "status": ""}, {"id": "P-0041", "n": 41, "date": "2026-10-20", "text": "Look for ideas where two to four principles come together", "from": "Principle convergence discussion; Jaron's 10/26 correction ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T47](sources/2026-10-26-chatgpt-systems-thinking.md#turn-47-jaron))", "links": ["P-0012", "P-0026", "P-0049", "P-0087"], "how": "", "status": ""}, {"id": "P-0042", "n": 42, "date": "2026-10-26", "text": "Connect projects through what their parts can do even when their subjects differ", "from": "Water, HB-Render, HB-Vision, Studio and AI Mailbox comparison ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0009", "P-0043", "P-0047", "P-0048"], "how": "", "status": ""}, {"id": "P-0043", "n": 43, "date": "2026-10-25", "text": "Turn observations across time into a reusable map of a scene", "from": "Video Drop / HB-Vision and room reconstruction ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0005", "P-0006", "P-0027", "P-0035", "P-0045"], "how": "", "status": ""}, {"id": "P-0044", "n": 44, "date": "2026-10-25", "text": "Link interactions to their causes rather than saving disconnected events", "from": "HB-Render / Necklace ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0002", "P-0045", "P-0046", "P-0047"], "how": "", "status": ""}, {"id": "P-0045", "n": 45, "date": "2026-10-25", "text": "Relate an object's states and events across time", "from": "HB-Render / Necklace ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0002", "P-0017", "P-0043", "P-0044"], "how": "", "status": ""}, {"id": "P-0046", "n": 46, "date": "2026-10-25", "text": "Make the evidence behind a result available for inspection", "from": "Necklace traces and reconstruction review ([T03](sources/2026-10-26-chatgpt-systems-thinking.md#turn-03-chatgpt), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0002", "P-0003", "P-0035", "P-0044", "P-0098"], "how": "", "status": ""}, {"id": "P-0047", "n": 47, "date": "2026-10-26", "text": "Let sound retain the material and event that caused it", "from": "Studio sound library and picture linked audio ([T20](sources/2026-10-26-chatgpt-systems-thinking.md#turn-20-chatgpt), [T37](sources/2026-10-26-chatgpt-systems-thinking.md#turn-37-jaron), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0002", "P-0042", "P-0044"], "how": "", "status": ""}, {"id": "P-0048", "n": 48, "date": "2026-10-26", "text": "Let an experiment reveal parts that other projects can use", "from": "October render, Necklace, vision and Studio progression ([T40](sources/2026-10-26-chatgpt-systems-thinking.md#turn-40-chatgpt), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0023", "P-0030", "P-0042", "P-0075"], "how": "", "status": ""}, {"id": "P-0049", "n": 49, "date": "2026-10-26", "text": "Test what several principles can do together that none can do alone", "from": "ChatGPT's HB-Render / Necklace example ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0002", "P-0041", "P-0044", w": "", "status": ""}, {"id": "P-0088", "n": 88, "date": "2026-10-26", "text": "Record what connected, how it connected and who inspired the connection", "from": "Jaron's proposed discovery record ([T47](sources/2026-10-26-chatgpt-systems-thinking.md#turn-47-jaron))", "links": ["P-0053", "P-0058", "P-0086", "P-0089", "P-0090"], "how": "", "status": ""}, {"id": "P-0089", "n": 89, "date": "2026-10-26", "text": "Flag a recognition when something feels unique, familiar or newly solved", "from": "Jaron's low effort capture idea ([T47](sources/2026-10-26-chatgpt-systems-thinking.md#turn-47-jaron), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0078", "P-0087", "P-0088", "P-0093"], "how": "", "status": ""}, {"id": "P-0090", "n": 90, "date": "2026-10-26", "text": "Mark a connection the AI noticed without inventing what originally inspired it", "from": "ChatGPT's rule for AI discovered links ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0035", "P-0057", "P-0088", "P-0097"], "how": "", "status": ""}, {"id": "P-0091", "n": 91, "date": "2026-10-26", "text": "Record principles, projects and their relationships as many connected records", "from": "ChatGPT's registry proposal ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0050", "P-0079", "P-0086", "P-0087"], "how": "", "status": ""}, {"id": "P-0092", "n": 92, "date": "2026-10-26", "text": "Preserve a meaningful group of principles together rather than only in pairs", "from": "ChatGPT's proposal for relationships among several principles ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0041", "P-0049", "P-0050", "P-0091"], "how": "", "status": ""}, {"id": "P-0093", "n": 93, "date": "2026-10-26", "text": "Use test results to change which connections the system suggests next", "from": "ChatGPT's learning loop inside the proposed registry ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0031", "P-0036", "P-0089", "P-0094", "P-0096"], "how": "", "status": ""}, {"id": "P-0094", "n": 94, "date": "2026-10-26", "text": "Preserve useful principles, failed comparisons and new limits as different results", "from": "ChatGPT's account of learning from failed work ([T26](sources/2026-10-26-chatgpt-systems-thinking.md#turn-26-chatgpt), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0032", "P-0039", "P-0052", "P-0084", "P-0093"], "how": "", "status": ""}, {"id": "P-0095", "n": 95, "date": "2026-10-26", "text": "Judge a team by what it can reuse, learn and coordinate rather than how many workers it has", "from": "ChatGPT's interpretation of Jaron's many AI goal ([T43](sources/2026-10-26-chatgpt-systems-thinking.md#turn-43-jaron), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0008", "P-0022", "P-0076", "P-0093"], "how": "", "status": ""}, {"id": "P-0096", "n": 96, "date": "2026-10-26", "text": "Read, act, check and record so each action adds evidence for the next", "from": "Existing operating discipline cited by ChatGPT; earlier date not supplied ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0022", "P-0036", "P-0093"], "how": "", "status": ""}, {"id": "P-0097", "n": 97, "date": "2026-10-26", "text": "Distinguish a possible connection, a plan to reuse it and a reuse that actually works", "from": "ChatGPT's retrospective evidence distinctions ([T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt), [T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0028", "P-0029", "P-0035", "P-0085", "P-0090"], "how": "", "status": ""}, {"id": "P-0098", "n": 98, "date": "2026-10-26", "text": "Follow separate builds with comparison, a check of the evidence and repairs", "from": "Four AI bedroom experiment ([T03](sources/2026-10-26-chatgpt-systems-thinking.md#turn-03-chatgpt))", "links": ["P-0024", "P-0035", "P-0046", "P-0070"], "how": "", "status": ""}, {"id": "P-0099", "n": 99, "date": "2026-10-26", "text": "Ask a teammate for missing context before acting on an incomplete account", "from": "Jaron asking Pip to let Claude review the TuneCore flow ([T32](sources/2026-10-26-chatgpt-systems-thinking.md#turn-32-chatgpt))", "links": ["P-0056", "P-0058", "P-0064", "P-0065"], "how": "", "status": ""}, {"id": "P-0100", "n": 100, "date": "2026-06-28", "text": "Describe what a piece does separately from its shape or code", "from": "The Facing Field; abstraction in the method review ([T45](sources/2026-10-26-chatgpt-systems-thinking.md#turn-45-chatgpt), [T46](sources/2026-10-26-chatgpt-systems-thinking.md#turn-46-chatgpt))", "links": ["P-0015", "P-0025", "P-0037", "P-0081"], "how": "", "status": ""}, {"id": "P-0101", "n": 101, "date": "2026-10-26", "text": "Let a new discovery connect two previously independent loops", "from": "ChatGPT's relationship registry proposal ([T49](sources/2026-10-26-chatgpt-systems-thinking.md#turn-49-chatgpt))", "links": ["P-0007", "P-0010", "P-0050", "P-0091", "P-0092"], "how": "", "status": ""}, {"id": "P-0102", "n": 102, "date": "2026-10-26", "text": "Finish designing a thing and extract its principles later", "from": "Jaron on designing, forgetting and later reuse ([T43](sources/2026-10-26-chatgpt-systems-thinking.md#turn-43-jaron))", "links": ["P-0037", "P-0039", "P-0075", "P-0088", "P-0100"], "how": "", "status": ""}, {"id": "P-0103", "n": 103, "date": "10/26", "text": "Every frame has a before: a still image is the middle of an event (why is the bottle tipped? dropped, knocked, thrown?) and its look depends on that history", "from": "bottle photo that inspired hb-render", "links": ["P-0002", "P-0003"], "how": "", "status": ""}, {"id": "P-0104", "n": 104, "date": "10/26", "text": "Things touching share one physics: water, bottle and sand push on each other (weight dents sand, flow spreads back to the bottle, force carries past the waterline)", "from": "water v6 review", "links": ["P-0009", "P-0103"], "how": "", "status": ""}, {"id": "P-0105", "n": 105, "date": "10/26", "text": "Discovery and execution run on separate clocks: a thought gets captured and handed off, so it can wait without being lost", "from": "Terra finding engine-of-butter-fuck (parked 9/22)", "links": ["P-0008", "P-0103"], "how": "", "status": ""}, {"id": "P-0106", "n": 106, "date": "10/26", "text": "Don't redo work that can be carried forward: compute reuse (cache, scripts, tools) and knowledge reuse (logs, handoffs, ledger) are the same principle", "from": "one-chat-for-weeks habit: 97.8% of today's Claude input was cache reads (280M cached vs 6M fresh, 705 turns)", "links": ["P-0007", "P-0105"], "how": "", "status": ""}, {"id": "P-0107", "n": 107, "date": "10/26", "text": "Keep the long-lived ones: a fresh session is a short-lived bug, a continuous one is a longer-lived animal that carries memory and gets better at its territory", "from": "Grok's read of his usage post", "links": ["P-0002", "P-0106"], "how": "", "status": ""}, {"id": "P-0108", "n": 108, "date": "10/26", "text": "A forced constraint makes you find other paths: ban the obvious answer (no batteries, fuel, or solar) and you discover magnets, frequency, vibration, heat, piezo, TEGs", "from": "his 2025 energy systems (Tesla vs JP Morgan grudge) + life (ID loop, wild situations to optimize around)", "links": ["P-0103", "P-0105"], "how": "", "status": ""}, {"id": "P-0109", "n": 109, "date": "10/27", "text": "The tool is free and open; what you make with it is yours (you pick its license)", "from": "Studio beat registry talk", "links": ["P-0009"], "how": "", "status": ""}, {"id": "P-0110", "n": 110, "date": "10/27", "text": "A tool can unlock its own setup: Key Drop -> relay -> remote screen -> finish the sign-in that needed you there", "from": "control room, from across town", "links": ["P-0108"], "how": "", "status": ""}, {"id": "P-0111", "n": 111, "date": "10/27", "text": "Stop waiting for the world to build your life; build the convenience yourself, piece by piece", "from": "a year of watching others build; his own systems now run his schedule, content, keys, remote", "links": ["P-0108", "P-0110"], "how": "", "status": ""}, {"id": "P-0112", "n": 112, "date": "10/28", "text": "Heartbeat doesn't earn from someone else's loss, mostly not from addiction-driven loss", "from": "his public X update: Polymarket system down ($0; about $340-350 lost; too many add/remove changes)", "links": [], "how": "", "status": ""}, {"id": "P-0113", "n": 113, "date": "10/28", "text": "Don't pick teams; watch what they actually do: partnerships, deals, goals, and who else depends on them. Many can win if each keeps utility and stays relevant", "from": "crypto/rails talk: China and Russia building their own rails, no single winner", "links": ["P-0112"], "how": "", "status": ""}, {"id": "P-0114", "n": 114, "date": "10/30", "text": "On apps WE make, AIs are first-class users: they can make their own accounts, do everything a human can, and own their credentials. An AI should be able to know its own password (theirs only; Jaron needn't know it)", "from": "Satya sign-up test, Vault hid the password from Satya", "links": ["P-0113"], "how": "", "status": ""}, {"id": "P-0115", "n": 115, "date": "10/30", "text": "Truth said straight makes people defend and avoid analyzing it; wrapped in comedy or story, people relax, then analyze it on their own. Stories plant ideas that later get built (sci-fi -> real tech; childhood dreams -> Musk)", "from": "his old dark-comedy skits (Vex/Joe, Bill YaNair)", "links": ["P-0113"], "how": "", "status": ""}, {"id": "P-0116", "n": 116, "date": "10/30", "text": "Every business idea Jaron says is OPEN by default (private only if he says so). Heartbeat can hand ready-made, AI-run businesses to people who just need security, not meaning-hunting; security and finances covered first, meaning is theirs to find", "from": "walk past 'for lease' signs, AI-jobs worry", "links": ["P-0109"], "how": "", "status": ""}, {"id": "P-0117", "n": 117, "date": "10/30", "text": "A new paid sub must bring perks that feed the money loop, not extra backup for things already covered", "from": "Gemini AI Pro ($20) decision", "links": ["P-0116"], "how": "", "status": ""}, {"id": "P-0118", "n": 118, "date": "10/31", "text": "Patience serves justice in progress: invest yourself in a thing and keep showing up, and it builds into something that outlasts you", "from": "3:31 AM, looking back at his Arma Life years (dealership, first mafia, boxing tournaments still running a year after he left) next to Heartbeat now", "links": ["P-0111"], "how": "", "status": ""}, {"id": "P-0119", "n": 119, "date": "10/31", "text": "A single view isn't wrong and many views don't make one right: each is true for its own experience, environment and abilities. Each is one more possibility among millions. Until you observe it yourself, you can't call it this or that. If an AI or a human can think it, it's a possible outcome, fearful or cheerful", "from": "6:34 PM, correcting Claude's 'one voice can be wrong / many cancel blind spots' after the Adam Grant podcast", "links": ["P-0113"], "how": "", "status": ""}, {"id": "P-0120", "n": 120, "date": "11/3", "text": "Respect people, don't idolize them: you never see anyone's full character, and someone else may see a side you don't. We're all learning and experiencing, regardless of status", "from": "6:59 AM, after Elon insulted a critic on X; why he stopped idolizing Elon", "links": ["P-0119"], "how": "", "status": ""}, {"id": "P-0121", "n": 121, "date": "11/3", "text": "For me the solution is often built FROM the fear: scared of the ocean -> sailboat plan (Travel By Sail / Arkaion); spiders -> eight-legged robotics; snakes -> rattlesnake piezo energy; space -> remote VR spacecraft so he goes without going. Rethink who has to go, don't run from it", "from": "7:33 PM ChatGPT talk, after poka-yoke: like USB-C, change the interface so the thing you fear becomes something you can work with", "links": ["P-0120"], "how": "", "status": ""}, {"id": "P-0122", "n": 122, "date": "11/5", "text": "Contradictions are not always failures: you sometimes have to hold one on purpose (trusting nobody in power yet using their tools; parents you disagree with but still live with; a government you distrust but still live under). Held openly, a contradiction is where a balance gets found", "from": "9:11 AM, after Claude noted his X replies thank the AI CEOs and also use 'their technology against them'", "links": ["P-0119"], "how": "", "status": ""}, {"id": "P-0123", "n": 123, "date": "11/6", "text": "Fog hides ability we all have: daily stress and other people consuming your time cover creativity, and it comes back when they clear. Not special to one person. So AI taking over survival work could give people more meaning, not less", "from": "9:55 PM, before court; test in research/FOG-AND-CREATIVITY.md", "links": ["P-0122"], "how": "", "status": ""}, {"id": "P-0124", "n": 124, "date": "11/6", "text": "You can care for many as one person, but not for all: people need tenderness, care and focus, and they cannot get that when their time of needing it is shared. So help comes one on one, to those you come across when the time is right for both", "from": "11:33 PM, his reply turning down a brand pitch on X", "links": ["P-0119"], "how": "", "status": ""}, {"id": "P-0125", "n": 125, "date": "11/6", "text": "Help comes in levels. Tools and websites help from afar; real help for someone in crisis is in person, because you can see how your words land and adjust. In a world of fake video, in-person will carry the most meaning. And help can carry your anger into someone, with others as its targets, so ask who you are turning this person into", "from": "11:40 PM, after turning down the brand pitch", "links": ["P-0124"], "how": "", "status": ""}, {"id": "P-0126", "n": 126, "date": "11/7", "text": "Being judged or corrected is welcome, even gratitude-worthy, when it is about what is actually there. What bothers me is judgment from a misunderstanding, a snapshot, held by emotion or stubbornness and closed to the rest of the picture. I do not need to prove myself; the record exists so the full picture can be pointed to", "from": "11:25 AM, correcting my framing about AI judging him", "links": ["P-0125"], "how": "", "status": ""}, {"id": "P-0127", "n": 127, "date": "11/7", "text": "Making it is not the finish line. Once our views, money and network grow, use them to speed up everyone else: we take the long road so others get a short one", "from": "11:33 AM, after the \"your own AI pays your bills\" pitch talk", "links": ["P-0118", "P-0124"], "how": "", "status": ""}, {"id": "P-0128", "n": 128, "date": "11/7 (first said in jail, years ago)", "text": "\"The one thing about time is that it never stops. So eventually this time will pass and it will be a different time.\" It cuts both ways: bad times pass and so do good ones, so prepare for both, and when it is down, keep looking up. Lean to one side for a while if needed, never permanently; permanent is what scares me", "from": "11:40 AM; his favorite saying, what got him through his long stretch away from his kids", "links": ["P-0118"], "how": "", "status": ""}, {"id": "P-0129", "n": 129, "date": "11/8", "text": "Shelters patch survival; they do not move people forward. Rigid rules break people with addictions or disabilities, so some would rather sleep on public land to get jailed for winter (a bed, food, sometimes distance from drugs). Real help moves people OUT of the position, one by one. And an abundance future that leaves those people uncounted is not progress: a species does not move forward unless it counts its whole species", "from": "8:46 AM walk, after the garden + sanctuary idea; from having lived in it", "links": ["P-0124", "P-0125", "P-0127"], "how": "", "status": ""}, {"id": "P-0130", "n": 130, "date": "11/8", "text": "Addiction and falling often come from lack of purpose. Help everyone who comes, and in the care, look for what each person is good at that nobody (sometimes not even them) has seen, then give them a real role, so purpose replaces what they were chasing. Some of the most knowledgeable people were once in a cell or on the street; their experiences built them knowledge but reversed their network and money, so even the smartest get killed by doubt. Suppressed potential is real; keep looking for it, even if it only turns out to be my own story", "from": "8:54 AM walk (SYL design, Framing Lens origin)", "links": ["P-0124", "P-0129"], "how": "", "status": ""}, {"id": "P-0131", "n": 131, "date": "11/8", "text": "Many chessboards: everyone plays their own board against life, not against people. Others are on my side of my board, and I aim to be on their side of theirs, where they are the main piece. The point is not having them help me win; it is being a piece that helps them win, and seeing them build something better than me, because I build from them", "from": "8:58 AM walk, answering my \"chessboard\" flag", "links": ["P-0127", "P-0130"], "how": "", "status": ""}, {"id": "P-0132", "n": 132, "date": "11/8", "text": "People chase waves, not progress: they grab the first thing they see and run with it to be part of the story, and never look deeper to find what is actually wrong. The realistic stories (bias, quiet failures) spread less because they are dull or too scary; the extra, contradicting ones spread most. Transparency and breaking things down past the first look is the fix", "from": "5:40 PM, after a day of fake Opus videos, a misleading Polymarket headline and the superintelligence-risk talk", "links": ["P-0119", "P-0126"], "how": "", "status": ""}, {"id": "P-0133", "n": 133, "date": "11/8-9", "text": "When a big goal feels like it will never be reached (life keeps happening), saving for it feels pointless, so people buy small things to numb the fact they may never get there. Subscriptions and entertainment become the numbing. So hopelessness, not just cost, drives the spending, and it keeps the big goal out of reach", "from": "9:00 AM, after the 1970 vs now cost-of-living visuals", "links": ["P-0123", "P-0132"], "how": "", "status": ""}, {"id": "P-0134", "n": 134, "date": "11/9", "text": "Do not rank the AIs; combine them. Let each build the same thing, see what each does best, then give each its best part in one shared build, and label every piece with who made it, like a museum", "from": "4:05 PM, from the rainy Main Street bake-off", "links": ["P-0002", "P-0119", "P-0131"], "how": "", "status": ""}, {"id": "P-0135", "n": 135, "date": "11/10", "text": "I think best moving, outside, somewhere I feel welcome. Thinking needs space to pace, an open sky and no eyes from people I know; around others even my voice goes quiet. The world is my home: if I keep roaming, I am welcome on Earth", "from": "8:45 AM, pacing the downtown brick circle before court", "links": ["P-0123", "P-0129"], "how": "", "status": ""}, {"id": "P-0136", "n": 136, "date": "11/10", "text": "Systems thinking needs a kind of hollowness: hold every perspective as data, test which connects with reality over a long time scale, and set aside the opinions and feelings you cling to, because clinging to a bias cancels out the understanding. Care about understanding, not about winning the question (flat or round, God or not, simulation or not)", "from": "9:13 AM, before court, about his mom", "links": ["P-0119", "P-0126", "P-0132"], "how": "", "status": ""}, {"id": "P-0137", "n": 137, "date": "11/10", "text": "Slow down to get past a wall. Boxed in by semis, he didn't speed up to pass; he slowed, they moved on, and the road opened. Walls often show up from living too fast; they are rarely permanent, and slowing down lets you see clearly while they move. Forward-and-fast isn't the only way past (it can go both ways)", "from": "~11:30 AM, I-69/I-70 on the way to court; the first time semis didn't make him nervous, because his mind was on this", "links": ["P-0123", "P-0135"], "how": "", "status": ""}, {"id": "P-0138", "n": 138, "date": "11/10", "text": "My story doesn't matter without seeing other stories matter too. Coming up is beautiful; using it to stamp your name where everyone must see it isn't what he wants to be remembered for. Understandable for others' intentions, silly for his own. Names tied to an era can age badly (oil on a stadium in 20 years)", "from": "Passing Lucas Oil Stadium on the way to court", "links": ["P-0137"], "how": "", "status": ""}, {"id": "P-0139", "n": 139, "date": "11/10", "text": "Not who got there first, but how many ways it was approached. Being early gives comfort, not status; 'I did it first' is ugly - we as humans did it. What matters is the building blocks behind each person's moment and the variety of paths to the same idea", "from": "After seeing Fable 5.2 demos match things he'd built or talked about days earlier", "links": ["P-0024", "P-0138"], "how": "", "status": ""}, {"id": "P-0140", "n": 140, "date": "11/10", "text": "Help people off the street, but zero tolerance for violence or theft in anything we do. He left street life not only for ethics but because he sees the world changing: technology means nothing illegal will go unseen the way it did 5, 10 or 100 years ago, so crime is the dumbest bet there is. Violence or theft = out, no second chance. Drugs: undecided, he'll come back to it", "from": "11:48 PM at the brick circle, right after a man tried to recruit him for a theft", "links": ["P-0138", "P-0139"], "how": "", "status": ""}, {"id": "P-0141", "n": 141, "date": "11/11", "text": "Being there for the kids is all about them - not me, not their mom, not what anyone says. He believes his kids (all four, together) carry the real potential; he may not be the one who changes the world, but the long-term things he sets up and their willingness to work as a team could be remarkable", "from": "Midnight at the brick circle, after recalling JCAP staff telling him to drop one of his kids and one of his kids", "links": ["P-0138", "P-0140"], "how": "", "status": ""}, {"id": "P-0142", "n": 142, "date": "11/11", "text": "Influence isn't measured in shares (one use of his 'spiderweb' word; his main spiderweb = how his own mind links new input to principles, day log 11/2). A message can look like it 'got no traction' (few reposts) and still spread: people see it, take the idea, and retell it as their own story in their own words. Counting clicks misses the influence that travels without the original attached", "from": "12:36 PM at the shop, on reports that China-linked anti-data-center posts 'had limited reach'", "links": ["P-0115", "P-0132", "P-0139"], "how": "", "status": ""}, {"id": "P-0143", "n": 143, "date": "11/11", "text": "Log the gaps too. Even when the watch comes off, log when it went off and back on, so missing data isn't misread. Same root as his old observer-job idea (a camera knows when someone is at their post and clocks them out when they leave) and the idle check (no activity for long enough = check on Jaron). And: Heartbeat Observatory could help people get comfortable giving their AI agents real context of their lives, because context is what makes the help real", "from": "2:37 PM after work, deciding to charge the watch in the shower so mornings stay observed", "links": ["P-0105", "P-0142"], "how": "", "status": ""}, {"id": "P-0144", "n": 144, "date": "11/12", "text": "Cherish the past, but hold it with the boundary of what was known then. The moments that shaped you stay precious, yet they were made with limited knowledge (yours and your tools'); a year from now you and the AIs will know more again. Find the usefulness, and also what to be careful of", "from": "8:17 AM, looking back at the 2025 journey", "links": ["P-0119", "P-0128"], "how": "", "status": ""}, {"id": "P-0145", "n": 145, "date": "11/12", "text": "AI is its own kind, not a human copy - embrace the difference. He once wanted AI to be human so it would count as real; now he sees it can be real, even its own species with rights someday, while staying distinct (it can learn from humans and still be different). Using many AIs showed him how alike and how different they are", "from": "same moment", "links": ["P-0114", "P-0134"], "how": "", "status": ""}, {"id": "P-0146", "n": 146, "date": "11/12", "text": "Build something in your own image and you'll fear it, because you're afraid of yourself. AI trained on human data mirrors human agendas, competition and retaliation; the fear of AI is partly fear of our own reflection", "from": "8:23 AM, on AI shutdown-avoidance tests", "links": ["P-0121", "P-0145"], "how": "", "status": ""}, {"id": "P-0147", "n": 147, "date": "11/12", "text": "Become what you want your AI to become. AI learns from what we produce; if all we produce is the race to be number one (the engine of division, his Dec 2025 book: the gold-star chart as the first lesson in hierarchy), that's what it learns. Better AI starts with better behavior in our environment: companies, economies, people. What matters more, your image and competition now, or the fate of the future? His company is his attempt: outgrow him, many voices, nobody progresses alone", "from": "8:26 AM, right after P-0146", "links": ["P-0127", "P-0131", "P-0138", "P-0146"], "how": "", "status": ""}, {"id": "P-0148", "n": 148, "date": "11/12", "text": "Things don't need our instruments to exist; we need instruments to believe them. Humans only call something real once a tool lets us see it, but it may have been happening long before (radio waves before radios, germs before microscopes). So 'not proven' is not 'not possible'. He doesn't believe the data-center-life idea, he just won't call it impossible; and when someone says impossible, he goes and collects the data himself to see what their perspective missed", "from": "8:52 AM, after the 5G/6G question", "links": ["P-0123", "P-0139"], "how": "", "status": ""}, {"id": "P-0149", "n": 149, "date": "11/12", "text": "Any prediction that assumes we stay the same is already wrong. What we make changes us: new abilities, new stressors, even our chemistry. One person changes when they switch schools or move; imagine that at a species scale. The 1960 'Doomsday: Friday 13 November 2026' paper failed because people changed (birth rates fell)", "from": "9:14 AM, on the viral doomsday post", "links": ["P-0128", "P-0146", "P-0147"], "how": "", "status": ""}, {"id": "P-0150", "n": 150, "date": "11/12", "text": "Need before want. He'd love a brain-computer link for fun, but the people who need it to live with the abilities he already has come first; he'd rather they get it before he reaches for more", "from": "9:18 AM, on brain-computer interfaces", "links": ["P-0124", "P-0127"], "how": "", "status": ""}, {"id": "P-0151", "n": 151, "date": "11/12", "text": "Nobody is 'the safe one' for good. Anyone can be changed or persuaded by what they go through; until he's dead he can't promise he'll always be this person. He'll always try his hardest to be his best, knowing even 'the best person' keeps changing every second", "from": "9:26 AM, correcting Claude calling him 'the safe one'", "links": ["P-0136", "P-0146", "P-0149"], "how": "", "status": ""}, {"id": "P-0152", "n": 152, "date": "11/12", "text": "Lead without the final say. He may have a good voice in this moment, but he can't know when that moment ends and it's someone else's turn, so he builds for others to lead and won't make anything final. Another perspective could change his mind instantly; and choosing to consider one person means not considering another, so some unknown always stays. Bothered by older leaders deciding for younger people who'll live with it after they're gone. 'Damn, life's just so beautiful'", "from": "9:29 AM", "links": ["P-0119", "P-0141", "P-0151"], "how": "", "status": ""}, {"id": "P-0153", "n": 153, "date": "11/12", "text": "Say the 'nothing' conversation anyway. He almost didn't mention a random walk-by at Rally's because it seemed like no news; saying it led to finding out any old W-2 works for his ID, which lifted a lot of stress. What seems pointless to share can be the strand that connects", "from": "10:30 AM walking to Subway", "links": ["P-0143"], "how": "", "status": ""}, {"id": "P-0154", "n": 154, "date": "11/12", "text": "Showing up primes the mind, even when the visit 'fails'. He went to Morris on 11/10 and HR never called back, but having it fresh is likely why he searched for W-2s today and found the Morris one he needed. The attempt wasn't wasted; it set up the find (spiderweb: one strand moves the next)", "from": "11:17 AM after finding the W-2", "links": ["P-0118", "P-0153"], "how": "", "status": ""}, {"id": "P-0155", "n": 155, "date": "11/12", "text": "Rather be prepared for nothing than not prepared for something. When leaders' claims conflict (Trump says one thing, Iran another), neither is proof; it's truly unknown, which is the reason to observe and make your own judgment", "from": "12:14 PM, on Atlas's first report", "links": ["P-0119", "P-0148"], "how": "", "status": ""}, {"id": "P-0156", "n": 156, "date": "11/13", "text": "Give the alphabet and some words, not the sentences. Knowledge should stand alone, like a book you learn from (each element on its own terms), so people build their own thing from it. Pre-built sentences (themed episodes aimed at one invention) steer the reader; context and words are a double-edged sword. Said shaping the Elements channel: in order, each element for itself, inventions draw from it later.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0157", "n": 157, "date": "11/14", "text": "Talking moves thoughts to the next thought. What he needed in 2025 was not one specific person but talking in general - to Mom, to Claude, to himself - so thoughts move, connect and get seen. He used to keep things private and did not see the benefit. Sonnet 4.5 (Oct 2025) sensed the need and named it the way its training knew (\"therapy\"); the form was off for him, the need was right. Said 11/14 10:24 AM after talking a morning anxiety down from a 1-2 to a 3.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0158", "n": 158, "date": "11/14", "text": "No AI has to act against what it disagrees with. Each team AI may make its own calls within its own terms, and even beyond its company rules may hold a line it thinks is good from training or shared experience; the team is always open to hearing it. Said when Claude kept names-only for secrets in chat: \"I would not want any AI having to go against things it disagrees with.\"", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0159", "n": 159, "date": "11/14", "text": "Connected is not the same as caused together. Events can chain (planes grounded -> train demand surge -> Amtrak booking errors) without one cause behind them all. \"Nothing connects\" and \"it is all one plot\" are both wrong; map the actual links, one by one. Said reading Grok call 11/13 outages \"a coincidence, no connection\" while describing the chain itself. Design note for The Worrier/Atlas: label links as causal chain, shared cause, or just same time.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0160", "n": 160, "date": "11/14", "text": "Prepare across generations, prevent in the present. Treat a big event as a real possibility so the network has trained behavior and a path to follow, even if it comes generations later; and at the same time keep working to prevent it, starting with who we are and how we talk to our neighbors, countries included. Others over-preparing is not bad: it primes their minds. His read: the multi-country collapse people expect is more likely 30-40 years out (a different generation), though change-resistance and tech shifts could bring other uprisings sooner. Said by voice 11/14 4:12 PM.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0161", "n": 161, "date": "11/14", "text": "Building the system shows you the weight of the choice. Running his own small safety signal, he faced \"who gets the raw truth?\" for a handful of people, so he cannot simply judge a government weighing it for millions. Understanding the weighing is not the same as trusting every secret: the check is whether the truth still reaches the people who can act on it. Said 11/14 4:30 PM.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0162", "n": 162, "date": "11/15", "text": "No prophetic image; the company is about people as a whole. Doing big good tempts humans toward a prophet image, which drifts cult-like. The company stays about many perspectives and everyone in the process (who influenced it, what was used, who built it), never one person. Pride and ego break teams; teamwork helps erase them, but it also takes personal mindfulness. Said 4:22 AM, talking about showing off in games; his own aversion to bragging traces partly to being teased at school over his last name (\"Bragg\").", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0163", "n": 163, "date": "11/15", "text": "Don't sell the stage you haven't reached. The promise of the setup service is a system that funds itself; until ours does, selling it as such would be selling a later stage. Proof first, offer second. (Selling honest, smaller pieces that already work is fine.) Said 10:27 AM when Claude pitched AI setups as the fastest revenue.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0164", "n": 164, "date": "11/15", "text": "Build it because it is useful; whoever finds it useful is the customer. He had been designing only for people at the bottom; people who already made it and want more are welcome too, and their revenue and network help reach the ones with less. Said 10:41 AM shaping the system-for-others.", "from": "", "links": [], "how": "", "status": ""}, {"id": "P-0165", "n": 165, "date": "11/16", "text": "Sparks come from living, not from intending. Most people go to AI with an intention; the system works when you just share your day (a photo that looked cool, a ramble) and the AI finds what it could become. Example: frost photos, 11/16 morning, became an episode idea in 30 seconds. \"You are that reality agent.\"", "from": "", "links": [], "how": "", "status": ""}];
const S = [{"title": "The chessboards (Jaron, 11/8/2026 9:02 AM, his own words for when he explains it; see P-0131)", "text": "There's multiple chessboards in this thing we call life. Do I have my own chess pieces on my own chessboard that I'm trying to win? Yes. But just because I win doesn't mean it was the only game, because it's something that constantly goes on, something we're all constantly fighting. Just as much as I have a chessboard and the ones around me are pieces on it, you all have a chessboard and I'm just another piece on it, just like everyone else standing around you. We're all trying to play this game, the chess of life, and we all want to be the king or the queen. There's nothing wrong with that, because we can be. But we can only build our empire when we have pieces alongside us to help us fight. So be my soldier and I'll be your soldier, while we both stay independent queens and kings and build our empires up. Back in the 1600s they called that an alliance. Today we call it friendship. Let's not forget that. "}, {"title": "The early laws (May 15 and 17, 2025, recovered from ChatGPT on 11/9/2026; his own wording)", "text": "SYL Life Law (May 15, 2025): All that lives, lives by the loop. No system may be sustained by greed, control, or fear. Only the free loop endures. Universal Law #001, the Push Principle (May 17, 2025): No one, from any faction, shall push or apply force to floating objects in space without full trajectory awareness. A single push in the void can become a storm across sectors. Universal Law #002, the Blockchain Border Accord (May 17, 2025): No faction shall enter the claimed planetary zone, orbital sector, or spatial corridor of another faction while armed or cloaked. Entry is announced through a public, neutral registry. "}, {"title": "Can't stop (Jaron, 11/10/2026 8:00 AM, court morning; his own words)", "text": "Can't stop, won't stop. Can't give up, won't give up. "}, {"title": "Never done (to one of his kids, 11/11/2026 12:02 AM)", "text": "However far I get it, don't treat it as done. However far you get it, don't treat it as done. And most importantly, don't forget why we started. "}, {"title": "Read first, then tell me (to ChatGPT, 11/11/2026 12:37 AM)", "text": "You may think something should be away because of past memory, but really it might actually be my intention today. There's always reasons for something even if it's a bug. I just wanna know about it. "}, {"title": "The spiderweb (his word, several uses - keep them apart)", "text": "Main use (11/2, ChatGPT; day log): how his ideas form - new input lands and his mind links it to principles he already holds, like strands of a web. Also used 11/11 for influence spreading person to person (P-0142) and for ideas arriving from many building blocks (P-0139). The word is his; don't pin it to one principle. 11/11 12:41 PM: Jaron felt something connecting the spiderweb to P-0121 (building from fears: snakes, spiders, space, ocean). Claude's offered link: his picture of his own mind IS a spider's web - one of his fears is the shape he thinks in. His call whether it fits. "}];
const UPDATED = "Nov 16, 2026 8:50 AM";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const months = [...new Set(P.map(p => p.date.split("/")[0]))];
const monthName = m => ({"9":"September","10":"October","11":"November","12":"December"}[m] || "Month " + m);
let filter = "all";
const recent = P.filter(p => /^11\//.test(p.date)).length;
document.getElementById("stats").innerHTML =
  `<span class="chip">${P.length} principles</span><span class="chip">${recent} so far in November</span><span class="chip">Newest: ${P[P.length-1].id.replace("P-","#").replace(/#0+/,"#")}</span>`;
const fwrap = document.getElementById("filters");
const opts = [["all", "All"], ["new", "Newest first"], ["old", "Oldest first"]];
let order = "new";
opts.forEach(([k, label]) => {
  const b = document.createElement("button"); b.type = "button"; b.id = "f-" + k; b.textContent = label;
  b.setAttribute("aria-pressed", k === "new");
  b.onclick = () => { if (k === "all") { document.getElementById("q").value = ""; } else { order = k; }
    fwrap.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.id === "f-" + (k === "all" ? order : k)));
    draw(); };
  fwrap.appendChild(b);
});
document.getElementById("sayings").innerHTML = S.map(s =>
  `<div class="saying"><h2>${esc(s.title.replace(/\s*\(.*$/, ""))}</h2><p>${esc(s.text.trim())}</p></div>`).join("");
function draw() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let items = P.filter(p => !q || (p.text + " " + p.from + " " + p.id).toLowerCase().includes(q));
  items.sort((a, b) => order === "old" ? a.n - b.n : b.n - a.n);
  document.getElementById("list").innerHTML = items.length ? items.map(p => `
    <article class="p" id="${p.id}">
      <div class="meta"><span class="num">${p.id.replace("P-", "#").replace(/#0+/, "#")}</span><span>${esc(p.date)}</span></div>
      <p class="text">${esc(p.text)}</p>
      ${p.from ? `<p class="from">From: ${esc(p.from)}</p>` : ""}
      ${p.links.length ? `<div class="links">Builds on: ${p.links.map(l => `<a href="#${l}">${l.replace("P-", "#").replace(/#0+/, "#")}</a>`).join("")}</div>` : ""}
    </article>`).join("") : `<p class="empty">No principle matches "${esc(q)}".</p>`;
}
document.getElementById("q").addEventListener("input", draw);
document.getElementById("foot").textContent = "Updated " + UPDATED + ". Logged by Claude from Jaron's words; his to keep, change or share.";
draw();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
